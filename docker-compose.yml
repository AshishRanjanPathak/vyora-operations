version: '3.8'

services:
  # 1. PostgreSQL 16 ACID Database
  postgres:
    image: postgres:16-alpine
    container_name: minierp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: minierp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minierp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minierp-network

  # 2. Node.js / Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minierp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword123@postgres:5432/minierp_db?schema=public
      JWT_SECRET: vyora-enterprise-jwt-super-secret-key-2026-acidity
      CLIENT_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && node prisma/seed.js && node src/server.js"
    networks:
      - minierp-network

  # 3. React 18 + Vite SPA Frontend (Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minierp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - minierp-network

volumes:
  pgdata:
    driver: local

networks:
  minierp-network:
    driver: bridge